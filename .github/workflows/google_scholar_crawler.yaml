name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    # Every day at 12:00 Beijing Time (UTC+8) = 04:00 UTC.
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-citation-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Update Google Scholar data
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          cd google_scholar_crawler
          python main.py

      - name: Publish citation data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd google_scholar_crawler/results

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gs_data.json gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "Citation data has not changed; nothing to publish."
            exit 0
          fi

          git commit -m "Update Google Scholar citation data"
          git branch -M google-scholar-stats
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:google-scholar-stats --force

      - name: Purge jsDelivr cache
        if: success()
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@google-scholar-stats/gs_data_shieldsio.json"
          echo
